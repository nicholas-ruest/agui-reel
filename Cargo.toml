[package]
name = "agui-reel"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Validate and visualize AG-UI 1.0 event streams"
license = "MIT"
repository = "https://github.com/nicholas-ruest/agui-reel"
keywords = ["ag-ui", "agents", "sse", "validation", "observability"]
categories = ["command-line-utilities", "development-tools::debugging"]

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.23.0"

[profile.release]
lto = "thin"
strip = true
